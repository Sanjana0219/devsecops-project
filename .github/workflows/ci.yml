name: DevSecOps CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: ["main"]

jobs:

  # 🧪 1. UNIT TESTS
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Run Tests
        run: npm test

  # 🔐 2. SECRET SCAN (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # 🔍 3. SAST (Semgrep)
  sast:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto

  # 📦 4. DEPENDENCY SCAN (Snyk)
  dependency-scan:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 🐳 5. DOCKER BUILD + SCAN
  docker:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t devsecops-app .

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app
          severity: CRITICAL,HIGH
          exit-code: 1

  # 🏗️ 6. IaC SCAN (Checkov)
  iac:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          skip_check: CKV_AWS_18,CKV_AWS_144

  # 🛡️ 7. POLICY CHECK (Conftest)
  policy:
    runs-on: ubuntu-latest
    needs: iac
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          chmod +x conftest
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest
        run: conftest test . --policy policy/

  # 🚀 8. DEPLOY DEV
  deploy-dev:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Deploy to Dev
        run: echo "Deploying to Dev Environment..."

  # 🚀 9. DEPLOY STAGING
  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging Environment..."

  # 🚀 10. DEPLOY PROD
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production Environment..."