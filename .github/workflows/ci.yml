name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test || true

  secret-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  sast:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v $PWD:/src returntocorp/semgrep semgrep scan

  dependency-scan:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g snyk
      - run: snyk test || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .

  container-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb stable main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy image devsecops-app || true

  iac-scan:
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4
      - run: pip install checkov
      - run: checkov -d .

  policy:
    runs-on: ubuntu-latest
    needs: iac-scan
    steps:
      - uses: actions/checkout@v4
      - run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_Linux_x86_64.tar.gz
          tar xzf conftest_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin
      - run: conftest test .

  deploy-dev:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - run: echo "Deploying to Dev"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - run: echo "Deploying to Staging"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - run: echo "Deploying to Production"