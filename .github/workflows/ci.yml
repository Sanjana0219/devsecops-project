name: DevSecOps CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: ["main"]

jobs:

  # 🔍 1. STATIC CODE + SECRET + DEPENDENCY SCAN
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      # 🔍 SEMGREP (SAST)
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto

      # 🔐 GITLEAKS (Secrets)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # 📦 SNYK (Dependencies)
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 🐳 2. BUILD + CONTAINER SCAN
  container-scan:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devsecops-app .

      # 🐳 TRIVY (Container Scan)
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # 🏗️ 3. IaC + POLICY CHECK
  policy:
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🏗️ CHECKOV (IaC SCAN)
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          skip_check: CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_61,CKV2_AWS_62

      # 🛡️ INSTALL CONFTEST (FIXED)
      - name: Install Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          chmod +x conftest
          sudo mv conftest /usr/local/bin/

      # 🛡️ RUN POLICY CHECK
      - name: Run Conftest
        run: |
          conftest test . --policy policy/

  # 🚀 4. DEPLOYMENT (SIMULATED)
  deploy:
    runs-on: ubuntu-latest
    needs: policy

    steps:
      - name: Deploy to Dev
        run: echo "Deploying to Dev Environment..."

      - name: Deploy to Staging
        run: echo "Deploying to Staging Environment..."

      - name: Deploy to Production
        run: echo "Deploying to Production Environment..."