name: DevSecOps Pipeline (Multi-Job)

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test || true

  secret-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  sast:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto

  dependency-scan:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .

  container-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      # rebuild image (jobs are isolated)
      - run: docker build -t devsecops-app .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app
        continue-on-error: true

  iac-scan:
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          skip_check: CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_61,CKV2_AWS_62
        continue-on-error: true

  policy:
    runs-on: ubuntu-latest
    needs: iac-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Conftest
        uses: instrumenta/conftest-action@v0.3.0
        with:
          files: .
        continue-on-error: true

  deploy-dev:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - run: echo "Deploying to Dev Environment..."

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - run: echo "Deploying to Staging Environment..."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - run: echo "Deploying to Production Environment..."